# Changelog rendering, ported from the git-cliff config release-plz replaces.
# Defaults cover the rest: per-package tags/releases named "{{ package }}-v{{ version }}",
# cargo-semver-checks forcing a major bump when the public API breaks, and
# crates with `publish = false` skipped.
[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
protect_breaking_commits = true
sort_commits = "newest"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^style", group = "Style" },
    { message = "^ci", group = "CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Miscellaneous" },
]
